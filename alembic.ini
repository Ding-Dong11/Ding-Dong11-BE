# Alembic 설정. 실제 DB 접속 URL 은 alembic/env.py 가 환경변수(DATABASE_URL 또는
# POSTGRES_*)에서 읽어 주입하므로 여기 sqlalchemy.url 은 비워둔다.
[alembic]
script_location = alembic
prepend_sys_path = .
# 마이그레이션 파일명: 0001_xxx 형태로 리비전이 앞에 오도록
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
